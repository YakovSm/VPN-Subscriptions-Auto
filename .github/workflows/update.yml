name: Update VPN Subscriptions

on:
  workflow_dispatch: {}      # Кнопка для ручного запуска

# Защита от наложения запусков (если скрипт работает дольше 10 минут)
concurrency:
  group: "vpn-updater"
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Разрешение на сохранение файлов в GitHub
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Download GeoIP Database
        run: |
          wget -q -O GeoLite2-Country.mmdb https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-Country.mmdb

      - name: Run Go Updater
        run: |
          rm -rf subscriptions
          go mod init vpn-updater
          go get gopkg.in/yaml.v3 github.com/oschwald/geoip2-golang
          go run main.go

      - name: Commit and push to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add subscriptions/
          # Удаляем базу GeoIP из индекса, чтобы не раздувать репозиторий
          git reset GeoLite2-Country.mmdb || true
          git commit -m "Auto-update subscriptions [skip ci]" || echo "No changes"
          git push origin main || git push origin master

      - name: Push to Codeberg mirror
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          CODEBERG_USER: "YakovSm"
          CODEBERG_REPO: "VPN-Subscriptions-Auto"
        run: |
          # 1. Клонируем репозиторий Codeberg
          git clone "https://${CODEBERG_USER}:${CODEBERG_TOKEN}@codeberg.org/${CODEBERG_USER}/${CODEBERG_REPO}.git" /tmp/codeberg-mirror
          cd /tmp/codeberg-mirror
          
          # 2. Удаляем старые файлы ссылок из корня
          rm -f raw_links.md
          rm -f yandex_links.md
          
          # 3. Создаем папку Subscriptions и чистим в ней старые .txt
          mkdir -p Subscriptions
          rm -f Subscriptions/*.txt
          
          # 4. Копируем свежие подписки в папку Subscriptions
          cp -r /github/workspace/subscriptions/* Subscriptions/
          
          # 5. Определяем текущую ветку и базовый URL
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          RAW_BASE="https://codeberg.org/${CODEBERG_USER}/${CODEBERG_REPO}/raw/branch/${BRANCH}/Subscriptions"
          
          # 6. Генерируем новые списки ссылок
          echo "# Ссылки на подписки" > raw_links.md
          echo "" >> raw_links.md
          echo "Список всех собранных подписок с прямыми ссылками на Codeberg." >> raw_links.md
          echo "" >> raw_links.md
          
          echo "# Подписки через Яндекс Переводчик" > yandex_links.md
          echo "" >> yandex_links.md
          echo "Используйте эти ссылки, если Codeberg заблокирован." >> yandex_links.md
          echo "" >> yandex_links.md
          
          # 7. Проходимся по файлам внутри папки Subscriptions
          for filepath in Subscriptions/*.txt; do
            if [ -f "$filepath" ]; then
              # Получаем только имя файла без пути
              file=$(basename "$filepath")
              
              DISPLAY_NAME=$(python3 -c "import urllib.parse, sys; print(urllib.parse.unquote(sys.argv[1]))" "${file%.*}")
              ENCODED_FILE=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "$file")
              
              RAW_URL="${RAW_BASE}/${ENCODED_FILE}"
              ENCODED_RAW_URL=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$RAW_URL")
              YANDEX_URL="https://translate.yandex.ru/translate?url=${ENCODED_RAW_URL}"
              
              echo "### $DISPLAY_NAME" >> raw_links.md
              echo "- Прямая ссылка: \`${RAW_URL}\`" >> raw_links.md
              echo "" >> raw_links.md
              
              echo "### $DISPLAY_NAME" >> yandex_links.md
              echo "- [Открыть через Яндекс](${YANDEX_URL})" >> yandex_links.md
              echo "- *Оригинальная ссылка*: \`${RAW_URL}\`" >> yandex_links.md
              echo "" >> yandex_links.md
            fi
          done
          
          # 8. Отправляем изменения
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Mirror update from GitHub" || echo "No changes"
          git push origin ${BRANCH}
          git commit -m "Mirror update from GitHub" || echo "No changes"
          git push origin ${BRANCH}
