name: Update VPN Subscriptions

on:
  workflow_dispatch: {}      # Кнопка для ручного запуска

# Защита от наложения запусков (если скрипт работает дольше 10 минут)
concurrency:
  group: "vpn-updater"
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Разрешение на сохранение файлов в GitHub
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Download GeoIP Database
        run: |
          wget -q -O GeoLite2-Country.mmdb https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-Country.mmdb

      - name: Run Go Updater
        run: |
          go mod init vpn-updater
          go get gopkg.in/yaml.v3 github.com/oschwald/geoip2-golang
          go run main.go

      - name: Commit and push to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add subscriptions/
          # Удаляем базу GeoIP из индекса, чтобы не раздувать репозиторий
          git reset GeoLite2-Country.mmdb || true
          git commit -m "Auto-update subscriptions [skip ci]" || echo "No changes"
          git push origin main || git push origin master

      - name: Push to Codeberg mirror
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          CODEBERG_USER: "YakovSm"
          CODEBERG_REPO: "VPN-Subscriptions-Auto"
        run: |
          # 1. Клонируем репозиторий Codeberg
          git clone "https://${CODEBERG_USER}:${CODEBERG_TOKEN}@codeberg.org/${CODEBERG_USER}/${CODEBERG_REPO}.git" /tmp/codeberg-mirror
          
          # 2. Копируем свежие файлы подписок
          cp -r subscriptions/* /tmp/codeberg-mirror/
          cd /tmp/codeberg-mirror
          
          # 3. Определяем текущую ветку (main или master)
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          
          # 4. Формируем базовый URL для raw-ссылок Codeberg
          RAW_BASE="https://codeberg.org/${CODEBERG_USER}/${CODEBERG_REPO}/raw/branch/${BRANCH}"
          
          # 5. Инициализируем файлы со ссылками
          echo "# Ссылки через Яндекс Переводчик" > yandex_links.md
          echo "" >> yandex_links.md
          echo "Нажмите на нужную подписку, чтобы открыть её через Яндекс Переводчик." >> yandex_links.md
          echo "" >> yandex_links.md
          
          echo "# Прямые raw-ссылки на Codeberg" > raw_links.md
          echo "" >> raw_links.md
          echo "Копируйте эти ссылки для импорта в VPN-клиенты напрямую." >> raw_links.md
          echo "" >> raw_links.md
          
          # 6. Генерируем ссылки для каждого файла
          for file in *.txt; do
            if [ -f "$file" ]; then
              # Кодируем имя файла для ссылки (пробелы станут %20)
              ENCODED_FILE=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "$file")
              
              # Собираем raw-ссылку
              RAW_URL="${RAW_BASE}/${ENCODED_FILE}"
              
              # Добавляем в файл raw_links.md
              echo "- ${RAW_URL}" >> raw_links.md
              
              # --- Логика для Яндекс Переводчика ---
              # Кодируем весь URL для параметра url=
              ENCODED_RAW_URL=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$RAW_URL")
              YANDEX_URL="https://translate.yandex.ru/translate?url=${ENCODED_RAW_URL}"
              
              # Декодируем имя файла для красивого отображения
              DISPLAY_NAME=$(python3 -c "import urllib.parse, sys; print(urllib.parse.unquote(sys.argv[1]))" "$file")
              
              # Добавляем в файл yandex_links.md
              echo "- [$DISPLAY_NAME]($YANDEX_URL)" >> yandex_links.md
            fi
          done
          
          # 7. Коммитим и пушим в Codeberg
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Mirror update from GitHub" || echo "No changes"
          git push origin ${BRANCH}
